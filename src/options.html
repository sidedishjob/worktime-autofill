<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>worktime-autofill 設定</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 16px;
        min-width: 320px;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 12px;
      }
      label {
        display: block;
        margin-bottom: 10px;
      }
      label > span {
        display: inline-block;
        width: 8em;
      }
      input[type="text"] {
        width: 6em;
        padding: 4px 6px;
      }
      .row-check {
        margin-top: 12px;
      }
      .actions {
        margin-top: 16px;
      }
      button {
        padding: 6px 12px;
        cursor: pointer;
      }
      #status {
        margin-left: 10px;
        color: #2a7;
        font-size: 12px;
      }
      #error {
        margin-top: 8px;
        color: #c33;
        font-size: 12px;
      }
      .hint {
        color: #777;
        font-size: 11px;
        margin-left: 4px;
      }
    </style>
  </head>
  <body>
    <h1>worktime-autofill 設定</h1>

    <label>
      <span>始業時刻</span>
      <input type="text" id="standardStart" placeholder="08:45" />
      <span class="hint">HH:MM</span>
    </label>
    <label>
      <span>終業時刻</span>
      <input type="text" id="standardEnd" placeholder="17:15" />
      <span class="hint">HH:MM</span>
    </label>
    <label>
      <span>休憩時間</span>
      <input type="text" id="standardBreak" placeholder="00:45" />
      <span class="hint">HH:MM</span>
    </label>

    <label class="row-check">
      <input type="checkbox" id="autoOnLoad" />
      ページ読込時に自動入力する
    </label>

    <div class="actions">
      <button id="save" type="button">保存</button>
      <span id="status"></span>
    </div>
    <div id="error"></div>

    <script src="defaults.js"></script>
    <script src="options.js"></script>
  </body>
</html>
